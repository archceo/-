<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ГЕО-КВЕСТ 3D — путешествие по планете</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:100%; height:100%; overflow:hidden; font-family:"Segoe UI", system-ui, -apple-system, sans-serif; background:#0c1b2a; color:#17303f;}
  canvas#scene{position:fixed; inset:0; width:100%; height:100%; display:block;}

  /* ---------- HUD ---------- */
  #hud{position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:14px;
    padding:10px 16px; z-index:20; pointer-events:none;}
  .hudBox{pointer-events:auto; background:rgba(255,255,255,.82); backdrop-filter:blur(8px);
    border:2px solid rgba(255,255,255,.9); border-radius:16px; padding:8px 14px;
    box-shadow:0 6px 18px rgba(0,20,40,.18); font-weight:700; font-size:15px; color:#1c4157;}
  #hud .logo{font-size:17px; letter-spacing:.5px;}
  #hud .logo span{color:#0e9ae0;}
  #hudLevel{font-size:14px; font-weight:600; color:#3a6b85;}
  #hudScore{margin-left:auto; font-size:16px; color:#a35b00;}
  #hudScore b{color:#e08000; font-size:19px;}

  #dots{position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:20;
    display:flex; gap:8px; background:rgba(255,255,255,.75); padding:6px 12px; border-radius:999px;
    box-shadow:0 4px 12px rgba(0,20,40,.15); pointer-events:none;}
  .dot{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:13px; background:#dfeaf2; border:2px solid #b9cfe0; transition:.3s;}
  .dot.active{background:#ffe08a; border-color:#f2b705; transform:scale(1.18);}
  .dot.done{background:#8ee08a; border-color:#3fb54a;}

  /* ---------- Вопросы ---------- */
  #panel{position:fixed; right:18px; top:50%; transform:translateY(-50%); width:430px; max-width:calc(100vw - 32px);
    z-index:25; background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(238,247,255,.96));
    border:3px solid #ffffff; border-radius:24px; padding:18px 20px 20px;
    box-shadow:0 18px 50px rgba(0,25,50,.3); transition:opacity .3s, transform .3s;}
  #panel.hidden{opacity:0; pointer-events:none; transform:translateY(-50%) translateX(40px);}
  .panelHead{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .badge{background:linear-gradient(90deg,#0e9ae0,#39c2f0); color:#fff; font-size:12px; font-weight:800;
    padding:5px 12px; border-radius:999px; letter-spacing:.4px; text-transform:uppercase;}
  .qCount{font-size:13px; font-weight:700; color:#5b829a;}
  .qProgress{display:flex; gap:6px; margin-bottom:12px;}
  .qProgress i{flex:1; height:7px; border-radius:6px; background:#d5e5f0; transition:.3s;}
  .qProgress i.on{background:linear-gradient(90deg,#39c2f0,#0e9ae0);}
  .qProgress i.ok{background:linear-gradient(90deg,#6ddc72,#2eb84a);}
  .qProgress i.bad{background:linear-gradient(90deg,#ff9d7a,#ef5f3c);}
  #pQuestion{font-size:18px; font-weight:800; color:#123449; line-height:1.35; margin-bottom:14px;}
  .opt{display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
    background:#fff; border:2px solid #cfe2ef; border-radius:14px; padding:11px 12px; margin-bottom:9px;
    font-size:15px; font-weight:600; color:#20495f; transition:.15s; font-family:inherit;}
  .opt:hover{border-color:#39c2f0; background:#f0faff; transform:translateX(3px);}
  .opt .letter{flex:0 0 28px; height:28px; border-radius:9px; background:#e8f3fb; color:#0e9ae0;
    font-weight:800; display:flex; align-items:center; justify-content:center; font-size:14px;}
  .opt.correct{border-color:#2eb84a; background:#eafbe9; }
  .opt.correct .letter{background:#2eb84a; color:#fff;}
  .opt.wrong{border-color:#ef5f3c; background:#fdeeea;}
  .opt.wrong .letter{background:#ef5f3c; color:#fff;}
  .opt:disabled{cursor:default; transform:none;}
  .opt.hide{display:none;}
  #pFeedback{display:none; animation:pop .3s ease;}
  #pFeedback.show{display:block;}
  #pFeedback .verdict{font-weight:800; font-size:15px; margin-bottom:8px;}
  #pFeedback .verdict.ok{color:#2eb84a;}
  #pFeedback .verdict.no{color:#ef5f3c;}
  .fact{background:linear-gradient(140deg,#fff8e1,#ffefc2); border:2px dashed #f2c14e; border-radius:14px;
    padding:11px 13px; font-size:14px; line-height:1.45; color:#6b4c00; margin-bottom:12px;}
  .fact b{display:block; margin-bottom:4px; color:#c47f00;}
  .btn{display:inline-block; cursor:pointer; border:none; border-radius:14px; padding:12px 22px;
    font-size:16px; font-weight:800; font-family:inherit; color:#fff;
    background:linear-gradient(90deg,#0e9ae0,#39c2f0); box-shadow:0 6px 16px rgba(14,154,224,.4);
    transition:.15s;}
  .btn:hover{transform:translateY(-2px); filter:brightness(1.07);}
  .btn.green{background:linear-gradient(90deg,#2eb84a,#6ddc72); box-shadow:0 6px 16px rgba(46,184,74,.4);}
  .btn.amber{background:linear-gradient(90deg,#f0a000,#ffcc4d); box-shadow:0 6px 16px rgba(240,160,0,.4); color:#5a3b00;}
  .btn.ghost{background:#eef5fa; color:#2b6c8e; box-shadow:none; border:2px solid #cfe2ef; font-size:14px; padding:9px 16px;}
  #hintBtn{width:100%; margin-top:4px;}

  /* ---------- Модальные экраны ---------- */
  #modal{position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    background:rgba(6,22,36,.55); backdrop-filter:blur(5px); padding:20px; transition:opacity .3s;}
  #modal.hidden{opacity:0; pointer-events:none;}
  .card{width:min(620px,100%); max-height:90vh; overflow:auto; background:linear-gradient(165deg,#ffffff,#eef8ff);
    border:4px solid #fff; border-radius:28px; padding:30px 32px; text-align:center;
    box-shadow:0 24px 70px rgba(0,15,35,.5); animation:pop .35s ease;}
  .card h1{font-size:34px; margin-bottom:6px; color:#0c4c6e; letter-spacing:.5px;}
  .card h2{font-size:27px; margin-bottom:10px; color:#0c4c6e;}
  .card p{font-size:16px; line-height:1.55; color:#33607c; margin-bottom:14px;}
  .card .bigEmoji{font-size:56px; margin-bottom:8px; display:block;}
  .howto{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:16px 0 20px;}
  .howto div{background:#fff; border:2px solid #d8ecfa; border-radius:16px; padding:12px 14px; width:170px;
    font-size:13.5px; line-height:1.4; color:#3d6c88; font-weight:600;}
  .howto b{display:block; font-size:20px; margin-bottom:5px;}
  .chips{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:12px 0 18px;}
  .chip{background:#e9f6ff; border:1.5px solid #bfe3fa; color:#136590; font-size:12.5px; font-weight:700;
    padding:5px 11px; border-radius:999px;}
  .scoreLine{font-size:20px; font-weight:800; color:#e08000; margin:6px 0 4px;}
  .rank{font-size:26px; font-weight:900; color:#0c4c6e; margin:8px 0 4px;}
  .loader{width:56px; height:56px; margin:6px auto 16px; border-radius:50%;
    border:7px solid #d7ecfa; border-top-color:#0e9ae0; animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pop{from{opacity:0; transform:scale(.93) translateY(12px);} to{opacity:1; transform:none;}}

  #loadErr{position:fixed; inset:0; z-index:99; display:none; align-items:center; justify-content:center;
    background:#0c1b2a; color:#cfe8f7; text-align:center; padding:30px; font-size:17px; line-height:1.6;}

  @media (max-width:820px){
    #panel{right:8px; left:8px; width:auto; top:auto; bottom:8px; transform:none; max-height:56vh; overflow:auto;}
    #panel.hidden{transform:translateY(40px);}
    #dots{top:56px;}
    .card{padding:22px 18px;}
    .card h1{font-size:26px;}
    .howto div{width:135px; font-size:12px;}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="hud">
  <div class="hudBox logo">🌍 ГЕО-<span>КВЕСТ</span> 3D</div>
  <div class="hudBox" id="hudLevel">Локация не выбрана</div>
  <div class="hudBox" id="hudScore">⭐ <b id="scoreVal">0</b> очков</div>
</div>

<div id="dots"></div>

<div id="panel" class="hidden">
  <div class="panelHead">
    <span class="badge" id="pTag">Локация</span>
    <span class="qCount" id="pCount">Вопрос 1 из 3</span>
  </div>
  <div class="qProgress" id="pProgress"><i></i><i></i><i></i></div>
  <div id="pQuestion">…</div>
  <div id="pOptions"></div>
  <div id="pFeedback">
    <div class="verdict" id="pVerdict"></div>
    <div class="fact" id="pFact"></div>
    <button class="btn green" id="pNext" style="width:100%">Дальше ➜</button>
  </div>
  <button class="btn ghost" id="hintBtn">💡 Подсказка 50:50 (один раз на уровень)</button>
</div>

<div id="modal">
  <div class="card" id="modalCard"></div>
</div>

<div id="loadErr">
  <div>🌍<br><b>Не удалось загрузить Three.js</b><br><br>
  Проверьте подключение к интернету и обновите страницу (F5).</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
if (typeof THREE === 'undefined') {
  setTimeout(() => { if (typeof THREE === 'undefined') {
    document.getElementById('loadErr').style.display = 'flex';
    document.getElementById('modal').classList.add('hidden');
  }}, 4000);
} else {
/* ================================================================
   ГЕО-КВЕСТ 3D — квест-игра по географии (1–7 классы)
   5 локаций по картинкам × 3 вопроса + интересные факты
   ================================================================ */

/* ---------------- ДАННЫЕ ИГРЫ ---------------- */
const LEVELS = [
 {
  name:"Горная долина", emoji:"⛰️", tag:"Локация 1 · Горы и озеро",
  intro:"Ты стоишь на берегу ледяного озера среди заснеженных вершин. Река несётся в долину, а с утёса рушится водопад. Прежде чем тропа приведёт тебя дальше — покажи, что ты знаешь горы!",
  shortFacts:["Эверест — 8848 м","Байкал — 1642 м","Водопад Анхель — 979 м"],
  questions:[
   { q:"Какая самая высокая гора на Земле?",

     f:"Джомолунгма (Эверест) — 8848,86 м! Причём гора всё ещё растёт: тектонические плиты поднимают её примерно на 4 мм в год. А всего 100 м подъёма — и температура падает почти на 0,6 °C."},
   { q:"Какое самое глубокое озеро планеты?",
     a:["Танганьика","Байкал","Ладожское","Каспийское"], c:1,
     f:"Байкал — 1642 м глубины. В нём хранится около 20 % всей пресной воды Земли, а живут здесь более 2500 видов животных и растений — почти все нигде больше не встречаются!"},
   { q:"Какой водопад самый высокий в мире?",
     a:["Ниагарский","Виктория","Анхель (Венесуэла)","Игуасу"], c:2,
     f:"Водопад Анхель — 979 метров! Вода падает с вершины столообразной горы Ауянтепуй и почти не долетает до земли: её разносит ветер в виде мелкого тумана."}
  ]
 },
 {
  name:"Пиратский остров", emoji:"🏴‍☠️", tag:"Локация 2 · Остров и море",
  intro:"«Полный вперёд!» Корабль причалил к необитаемому острову с пальмами и каменной аркой. На песке — открытый сундук с золотом… Но карта дальше лежит только у того, кто ответит на 3 вопроса!",
  shortFacts:["Гренландия — самый большой остров","Саргассово море — без берегов","Большой Барьерный риф виден из космоса"],
  questions:[
   { q:"Какой остров самый большой в мире?",
     a:["Мадагаскар","Гренландия","Новая Зеландия","Великобритания"], c:1,
     f:"Гренландия — 2 166 086 км², это как 3 Украины или вся Индия! 80 % острова скрыто подо льдом толщиной до 3 км, а название переводится как «зелёная страна» — викинги назвали её так, чтобы заманить сюда поселенцев."},
   { q:"Единственное в мире море без берегов, где плавают водорослевые «плоты»?",
     a:["Саргассово море","Мраморное море","Красное море","Балтийское море"], c:0,
     f:"Саргассово море ограничено не берегами, а только течениями. Древние мореплаватели боялись его: корабли, попав в густые саргассовые водоросли, будто застревали и не могли двигаться."},
   { q:"Самый большой коралловый риф планеты находится у берегов…",
     a:["Египта","Бали","Австралии","Мадагаскара"], c:2,
     f:"Большой Барьерный риф у Австралии тянется на 2300 км — его видно даже из космоса! Это самый большой живой организм на Земле: дом для 1500 видов рыб и 400 видов кораллов."}
  ]
 },
 {
  name:"Тропический лес", emoji:"🌴", tag:"Локация 3 · Джунгли",
  intro:"Воздух влажный и горячий, вокруг пальмы, орхидеи и крики попугаев. Тропа уходит вглубь зелёного мира. За тремя ответами — выход к следующей локации!",
  shortFacts:["Амазония — 60 % тропических лесов","Амазонка несёт 20 % речной воды","У экватора день = ночь"],
  questions:[
   { q:"Где находится самый большой тропический лес планеты?",
     a:["В Африке","В Южной Америке, в бассейне Амазонки","В Австралии","В Индии"], c:1,
     f:"Амазонский лес — 5,5 млн км², это 60 % всех тропических лесов Земли. Его называют «лёгкими планеты»: деревья вырабатывают около 20 % кислорода, который мы вдыхаем."},
   { q:"Какая река несёт к океану больше всех воды в мире?",
     a:["Нил","Амазонка","Янцзы","Волга"], c:1,
     f:"Амазонка уступает Нилу лишь в длине (6992 км против 6850), но по водности — рекордсмен: каждую секунду она выносит около 200 000 м³ воды — это примерно пятая часть всей речной воды планеты."},
   { q:"Какой климат у экватора?",
     a:["Холодный полярный","Жаркий и влажный круглый год","Сухой пустынный","Умеренный, четыре сезона"], c:1,
     f:"У экватора солнце почти всегда высоко, поэтому +25…+30 °C и ливни почти каждый день. А ещё здесь идеальный «распорядок»: день и ночь длятся поровну — по 12 часов."}
  ]
 },
 {
  name:"Болото", emoji:"🐸", tag:"Локация 4 · Болото",
  intro:"Тропа уходит под воду: кувшинки, камыш, старые поваленные деревья и тихая зелёная гладь. Здесь легко заблудиться… Если знаешь факты о болотах — тебя не поймать!",
  shortFacts:["Васюганское болото — №1 в мире","Болота поглощают CO₂","Торф — порода из растений"],
  questions:[
   { q:"Какое самое большое болото в мире?",
     a:["Васюганское в Западной Сибири","Припятское в Беларуси","Болота Амазонии","Болота Сенегала"], c:0,
     f:"Васюганское болото — около 53 000 км², это как небольшая страна! Оно образовалось около 10 000 лет назад на месте отступления ледника и хранит миллиарды тонн торфа."},
   { q:"Что болото делает с воздухом?",
     a:["Очищает его и поглощает углекислый газ","Делает его сухим","Ничего не делает","Выделяет песок"], c:0,
     f:"Болота — «фильтры» планеты: они очищают воду, поглощают углекислый газ и служат домом для птиц. По болотным озёрам каждую ось миллионы перелётных птиц выбирают место для отдыха."},
   { q:"Что такое торф?",
     a:["Разновидность алмаза","Порода из не до конца перепревших растений","Жидкая нефть","Вулканическая зола"], c:1,
     f:"Торф — это мхи и травы, которые тысячелетиями копились в воде и не успели перепреть. Он горит, а из него делают удобрения и лекарства. Запасы торфа в России — одни из крупнейших в мире."}
  ]
 },
 {
  name:"Луг у старого дуба", emoji:"🌼", tag:"Локация 5 · Луг и равнина",
  intro:"Наконец-то суша! Зелёные холмы, цветы и большой дуб с деревянной табличкой. Это последняя локация: три вопроса — и квест завершён!",
  shortFacts:["Русская равнина — 4 млн км²","Устье Волги — дельта 32 000 км²","Плато — «стол» со склонами"],
  questions:[
   { q:"Какая самая большая равнина России?",
     a:["Восточно-Европейская (Русская)","Западно-Сибирская","Туранская","Прикаспийская"], c:0,
     f:"Восточно-Европейская равнина — около 4 млн км²! Почти вся Россия к западу от Урала лежит на ней: это леса, реки, озёра и плодородные чернозёмы."},

const ZONE_X   = [0, 150, 300, 450, 600];
const ATMOS = [
 {top:0x2b8fe0, bottom:0xd9f1ff, fog:0xd9f1ff, near:80,  far:330},
 {top:0x1f9fd8, bottom:0xd6f4ff, fog:0xcdeefb, near:60,  far:230},
 {top:0x2fa0e0, bottom:0xe8fbff, fog:0xd6f2e6, near:45,  far:190},
 {top:0x5f9fbe, bottom:0xd5ecd9, fog:0xbfe0c8, near:30,  far:150},
 {top:0x3f9fe8, bottom:0xeaf7ff, fog:0xeaf7ff, near:70,  far:290}
];
const CAM = [
 {r:52, h:22, look:8,  start:Math.PI/2},
 {r:50, h:19, look:5,  start:Math.PI/2 + .5},
 {r:45, h:16, look:6,  start:Math.PI/2},
 {r:44, h:15, look:4,  start:Math.PI/2 - .4},
 {r:50, h:18, look:7,  start:Math.PI/2}
];

/* ---------------- СОСТОЯНИЕ ИГРЫ ---------------- */
const G = { level:0, q:0, score:0, levelScore:0, tried:false, hintUsed:false, locked:false, started:false };

const $ = id => document.getElementById(id);
const scoreVal = $('scoreVal'), hudLevel = $('hudLevel');
const panel = $('panel'), modal = $('modal'), modalCard = $('modalCard');

function updateHud(){
  scoreVal.textContent = G.score;
  hudLevel.textContent = LEVELS[G.level] ? (LEVELS[G.level].emoji + ' ' + LEVELS[G.level].name) : '—';
}
function buildDots(){
  const d = $('dots'); d.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const s = document.createElement('span');
    s.className = 'dot' + (i < G.level ? ' done' : i === G.level ? ' active' : '');
    s.textContent = L.emoji; d.appendChild(s);
  });
}
function showModal(html){ modalCard.innerHTML = html; modal.classList.remove('hidden'); }
function hideModal(){ modal.classList.add('hidden'); }

/* ---------------- ЗВУКИ ---------------- */
let actx = null;
function tone(freq, dur, delay=0, type='sine', vol=.12){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    const t0 = actx.currentTime + delay;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + .02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + .05);
  }catch(e){}
}

function reg(o, shadow=true){ o.castShadow = shadow; o.receiveShadow = true; return o; }

/* мягкая «радиальная» текстура для краёв воды, тропинок и лужаев */
function softTex(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'#fff'); gr.addColorStop(.72,'#fff'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
const SOFT = softTex();

function patch(x, color, r, y=0.05, opacity=1){
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 64),
    new THREE.MeshStandardMaterial({color, roughness:1, transparent:true, opacity, alphaMap:SOFT, depthWrite:false}));
  m.rotation.x = -Math.PI/2; m.position.set(x, y, 0); m.receiveShadow = true;
  scene.add(m); return m;
}
function water(x, z, r, color, opacity=.88, y=.12){
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 64),
    new THREE.MeshStandardMaterial({color, roughness:.12, metalness:.25, transparent:true, opacity, alphaMap:SOFT}));
  m.rotation.x = -Math.PI/2; m.position.set(x, y, z);
  scene.add(m);
  animated.push(t => { m.position.y = y + Math.sin(t*1.2 + x)*0.035; });
  return m;
}
function canvasTex(draw, w=128, h=128){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}

/* ---------------- ОБЩЕ ЭЛЕМЕНТЫ ---------------- */
function cloudAt(x, y, z, s=1, speed=1.1){
  const g = new THREE.Group();
  for(let i=0;i<5;i++){
    const b = sph(rnd(2.6,5.2), 0xffffff, {roughness:1}, 12, 8);
    b.position.set(rnd(-6,6), rnd(-1.2,1.6), rnd(-2.5,2.5));
    b.scale.y = .65; b.castShadow = false; g.add(b);
  }
  g.position.set(x,y,z); g.scale.setScalar(s); world.add(g);
  const x0 = x;
  animated.push((t,dt) => { g.position.x += dt*speed; if(g.position.x > x0+70) g.position.x = x0-70; });
  return g;
}
function mountain(x, z, h, r, rock=0x8b93a3){
  const g = new THREE.Group();
  const base = reg(cone(r, h, rock, 7));
  base.position.y = h/2 - 1; base.rotation.y = rnd(0, 6.28);
  base.material.flatShading = true;
  g.add(base);
  const snow = reg(cone(r*.44, h*.34, 0xffffff, 7));
  snow.position.y = h - h*.17 - 1; snow.rotation.y = base.rotation.y;
  snow.material.flatShading = true; g.add(snow);
  g.position.set(x, 0, z); world.add(g); return g;
}
function hill(x, z, r, color, sy=.24){
  const h = reg(sph(r, color), false);
  h.scale.y = sy; h.position.set(x, 0, z); h.receiveShadow = true; world.add(h); return h;
}
function palm(x, z, s=1, leafA=0x3fa34d, leafB=0x2f8b3f){
  const g = new THREE.Group();
  const trunk = reg(cyl(.4,.75,9,0x8a6a3f,8));
  trunk.position.y = 4.5; trunk.rotation.z = rnd(-.1,.1); g.add(trunk);
  const top = new THREE.Group(); top.position.y = 9; g.add(top);
  for(let i=0;i<7;i++){
    const pivot = new THREE.Group(); pivot.rotation.y = i/7*Math.PI*2; top.add(pivot);
    const leaf = reg(new THREE.Mesh(new THREE.SphereGeometry(1,8,6), M(i%2?leafA:leafB)), false);
    leaf.scale.set(4.6,.26,1.2); leaf.position.x = 2.7;
    leaf.rotation.z = -.42 + rnd(-.12,.1); pivot.add(leaf);
  }
  for(let i=0;i<3;i++){
    const c = reg(sph(.35, 0x6b4a22), false);
    c.position.set(rnd(-.7,.7), -.5, rnd(-.7,.7)); top.add(c);
  }
  g.position.set(x,0,z); g.scale.setScalar(s); world.add(g);
  animated.push(t => { top.rotation.z = Math.sin(t*.7 + x)*.045; top.rotation.x = Math.cos(t*.6 + z)*.035; });
  return g;
}
function flowerPatch(x, z, colors, n=12, r=7){
  for(let i=0;i<n;i++){
    const f = reg(sph(rnd(.18,.34), colors[(Math.random()*colors.length)|0], {roughness:.7}), false);
    f.position.set(x + rnd(-r,r), rnd(.2,.45), z + rnd(-r,r));
    world.add(f);
    const stem = cyl(.03,.03,.35,0x3f8b3f,5); stem.position.set(f.position.x, .17, f.position.z); world.add(stem);
  }
}
function rocks(x, z, n=5, r=1.5, color=0x9aa0a8){
  for(let i=0;i<n;i++){
    const s = reg(dode(rnd(r*.5,r), color), false);
    s.position.set(x+rnd(-6,6), rnd(0,.6), z+rnd(-6,6));
    s.rotation.set(rnd(0,3), rnd(0,3), rnd(0,3));
    world.add(s);
  }
}

      new THREE.MeshStandardMaterial({color:0xe8c98e, roughness:1, transparent:true, alphaMap:SOFT, depthWrite:false}));
    t.rotation.x = -Math.PI/2;
    t.position.set(x + Math.sin(i*.55)*7, .1, 58 - i*9.5);
    t.receiveShadow = true; world.add(t);
  }

  // тропические деревья и пальмы вдоль тропы
  const treeSpots = [[-26,20],[-20,-6],[-30,-30],[24,26],[30,0],[22,-24],[-12,44],[16,46],[36,-44],[-34,44]];
  treeSpots.forEach((p,i) => {
    const tx = x + p[0], tz = p[1];
    if(i % 3 === 0){ palm(tx, tz, rnd(.95,1.3), 0x6ec24a, 0x3f9e3f); return; }
    const h = rnd(9, 14);
    const trunk = reg(cyl(.5,.9,h,0x7d5a35,8)); trunk.position.set(tx, h/2, tz); world.add(trunk);
    const shades = [0x2f8f3f, 0x3fae4f, 0x277a36, 0x4bbb5c];
    for(let b=0;b<3;b++){
      const bl = reg(sph(rnd(3.6,5.4), shades[(Math.random()*shades.length)|0]), false);
      bl.position.set(tx + rnd(-3,3), h + rnd(-.5,3.5), tz + rnd(-3,3));
      world.add(bl);
    }
    animated.push(t => { trunk.rotation.z = Math.sin(t*.5 + tx)*.02; });

  // цветы и кусты
  flowerPatch(x, 30, [0xff6fb1, 0xff9a3c, 0xffd447, 0xffffff], 16, 12);
  flowerPatch(x-18, -18, [0xb45dff, 0xff6fb1, 0xff5b5b], 14, 10);
  flowerPatch(x+20, 8, [0xffd447, 0xff9a3c, 0xffffff], 14, 10);
  [[-16,12],[18,-14],[-26,34],[28,36],[8,-36]].forEach(p => {

  cloudAt(x-30, 52, -50, 1.4, 1); cloudAt(x+34, 58, -40, 1.2, 1.3);

/* ================================================================
   КАМЕРА: орбита + кинематографичные переходы
   ================================================================ */
const cam = {
  angle: CAM[0].start, radius: CAM[0].r, height: CAM[0].h,
  center: new THREE.Vector3(ZONE_X[0], CAM[0].look, 0),
  look: new THREE.Vector3(ZONE_X[0], CAM[0].look, 0),
  mouse: new THREE.Vector2(0,0), shake:0
};
let tween = null;

addEventListener('mousemove', e => {
  cam.mouse.x = (e.clientX / innerWidth - .5) * 2;
  cam.mouse.y = (e.clientY / innerHeight - .5) * 2;
});

function flyTo(levelIdx, onDone){
  const c0 = cam.center.clone(), l0 = cam.look.clone();
  const C = CAM[levelIdx];
  const c1 = new THREE.Vector3(ZONE_X[levelIdx], C.look, 0);
  const a0 = cam.angle;
  let a1 = a0 + 2.6;
  tween = {t:0, dur: AUTOTEST ? .08 : 3.4, c0, c1, l0, l1:c1.clone(), a0, a1, r0:cam.radius, h0:cam.height, r1:C.r, h1:C.h, onDone};
}
function easeInOut(k){ return k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k+2, 3)/2; }

function updateCamera(dt){
  if(tween){
    tween.t += dt;
    let k = Math.min(1, tween.t / tween.dur), e = easeInOut(k);
    const arc = Math.sin(k * Math.PI);
    cam.angle = tween.a0 + (tween.a1 - tween.a0) * e;
    cam.radius = tween.r0 + (tween.r1 - tween.r0) * e + arc * 30;
    cam.height = tween.h0 + (tween.h1 - tween.h0) * e + arc * 26;
    cam.center.lerpVectors(tween.c0, tween.c1, e);
    cam.look.lerpVectors(tween.l0, tween.l1, e);
    if(k >= 1){ const d = tween.onDone; tween = null; if(d) d(); }
  } else {
    cam.angle += dt * 0.05;
  }
  const cx = cam.center.x + Math.cos(cam.angle) * cam.radius;
  const cz = cam.center.z + Math.sin(cam.angle) * cam.radius;
  camera.position.set(cx + cam.mouse.x * 1.6, cam.height + Math.sin(performance.now()*.0006)*.5 - cam.mouse.y * 1.2, cz);
  camera.lookAt(cam.look);
}

/* ---------------- АТМОСФЕРА (небо и туман) ---------------- */
const atmo = {
  top: new THREE.Color(ATMOS[0].top), bottom: new THREE.Color(ATMOS[0].bottom), fog: new THREE.Color(ATMOS[0].fog),
  near: ATMOS[0].near, far: ATMOS[0].far
};
function updateAtmo(dt, idx){
  const A = ATMOS[idx], k = Math.min(1, dt * 1.3);
  atmo.top.lerp(new THREE.Color(A.top), k);
  atmo.bottom.lerp(new THREE.Color(A.bottom), k);
  atmo.fog.lerp(new THREE.Color(A.fog), k);
  atmo.near += (A.near - atmo.near) * k;
  atmo.far  += (A.far  - atmo.far ) * k;
  skyU.top.value.copy(atmo.top); skyU.bottom.value.copy(atmo.bottom);
  scene.fog.color.copy(atmo.fog); scene.fog.near = atmo.near; scene.fog.far = atmo.far;
  scene.background.copy(atmo.bottom);
}

function loop(){

  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;

function showLevelIntro(){

  panel.classList.add('hidden');
  showModal(`

    <p>${L.intro}</p>
    <div class="fact" style="text-align:left"><b>💡 Интересный факт этой локации</b>${L.questions[0].f.split('.')[0]}.</div>
    <button class="btn" id="btnGo">▶ К вопросам</button>
  `);
  $('btnGo').onclick = () => { sClick(); hideModal(); showQuestion(); };
}

function showQuestion(){
  const L = LEVELS[G.level], Q = L.questions[G.q];
  G.tried = false;
  panel.classList.remove('hidden');
  $('pTag').textContent = L.tag;
  $('pCount').textContent = `Вопрос ${G.q + 1} из ${L.questions.length}`;
  $('pQuestion').textContent = Q.q;
  $('pFeedback').classList.remove('show');
  $('hintBtn').style.display = hintUsed ? 'none' : 'block';
  $('hintBtn').disabled = false;

  // прогресс
  const pr = $('pProgress').children;
  for(let i = 0; i < 3; i++){ pr[i].className = i < G.q ? 'on' : ''; }

  const wrap = $('pOptions'); wrap.innerHTML = '';
  Q.a.forEach((text, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="letter">${LETTERS[i]}</span><span class="txt">${text}</span>`;
    b.dataset.i = i;
    b.onclick = () => answer(i, b);
    wrap.appendChild(b);
  });
}

function answer(i, btn){
  if(G.locked) return;
  const Q = LEVELS[G.level].questions[G.q];
  const opts = [...$('pOptions').children];
  if(i === Q.c){
    opts[Q.c].classList.add('correct');
    opts.forEach(o => o.disabled = true);
    const gained = G.tried ? 0 : 10;
    G.score += gained; G.levelScore += gained;
    G.tried = true;
    sRight();
    $('pVerdict').className = 'verdict ok';
    $('pVerdict').textContent = gained ? '🎉 Отлично! Правильный ответ +10 очков' : '✅ Правильно!';
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    G.tried = true;
    sWrong();
    opts[Q.c].classList.add('correct');
    opts.forEach(o => o.disabled = true);
    $('pVerdict').className = 'verdict no';
    $('pVerdict').textContent = '❌ Не угадал. Правильный ответ: ' + LETTERS[Q.c] + ') ' + Q.a[Q.c];
  }
  $('pFact').innerHTML = '<b>💡 Запомни факт</b>' + Q.f;
  $('pFeedback').classList.add('show');
  $('hintBtn').style.display = 'none';
  updateHud();
  const pr = $('pProgress').children;
  pr[G.q].className = (i === Q.c ? 'ok' : 'bad');
}

$('pNext').onclick = () => {

};

$('hintBtn').onclick = () => {

  const wrong = [0,1,2,3].filter(i => i !== Q.c).sort(() => Math.random() - .5).slice(0, 2);
  [...$('pOptions').children].forEach((b, i) => { if(wrong.includes(i)) b.classList.add('hide'); });

};

function levelComplete(){
  const L = LEVELS[G.level];
  sWin();
  const last = G.level === LEVELS.length - 1;
  showModal(`
    <span class="bigEmoji">${L.emoji}✅</span>

    <div class="chips">${L.shortFacts.map(f => `<span class="chip">💡 ${f}</span>`).join('')}</div>

      ? `<button class="btn amber" id="btnFinish">🏆 Завершить квест</button>`
      : `<button class="btn" id="btnFly">🚀 Лететь дальше ➜</button>`}
  `);

    <div class="scoreLine">${s} из 150 очков</div>

      ' M' + (modal.classList.contains('hidden') ? 0 : 1) +
      ' B' + (el('btnFly') ? 1 : 0) + (el('btnGo') ? 1 : 0) + (el('btnFinish') ? 1 : 0) +
      (done ? ' DONE' + G.score : '') + (errs.length ? ' E' + errs.join('~') : '');
    if (!done && el('btnAgain')){
      done = true;
      const d = document.createElement('div');
      d.id = 'testResult';
      d.textContent = 'TESTDONE score=' + G.score + ' level=' + G.level +
        ' questions=' + G.q + ' err=' + (errs.length ? errs.join(' | ') : 'none');
      document.body.appendChild(d);
      clearInterval(iv); return;
    }
    if (steps > 800){
      const d = document.createElement('div');
      d.id = 'testResult';
      d.textContent = 'TESTTIMEOUT score=' + G.score + ' level=' + G.level + ' q=' + G.q +
        ' err=' + (errs.length ? errs.join(' | ') : 'none');
      document.body.appendChild(d);
      clearInterval(iv); return;
    }
    if (!modal.classList.contains('hidden')){
      if (SHOTLEVEL >= 0 && G.level === SHOTLEVEL && el('btnGo')){
        hideModal(); panel.classList.add('hidden');
        clearInterval(iv);
        setTimeout(() => {
          renderer.setSize(1200, 750, false);
          renderer.render(scene, camera);
          const holder = document.createElement('div');
          holder.id = 'shotData';
          try { holder.textContent = renderer.domElement.toDataURL('image/png'); }
          catch(e){ holder.textContent = 'SHOTERR ' + e.message; }
          document.body.appendChild(holder);
          document.title = 'SHOTREADY L' + SHOTLEVEL;
        }, 1500);
        return;
      }
      const b = el('btnStart') || el('btnGo') || el('btnFly') || el('btnFinish');
      if (b) b.click();
      return;
    }
    if (el('pFeedback').classList.contains('show')){ el('pNext').click(); return; }
    const Q = LEVELS[G.level].questions[G.q];
    if (WRONGMODE){
      if (G.q === 0 && !hintUsed && el('hintBtn') && el('hintBtn').style.display !== 'none'){ el('hintBtn').click(); return; }
      const kids = [...$('pOptions').children];
      const bad = kids.find((b, i) => i !== Q.c && !b.classList.contains('hide'));
      if (bad) bad.click();
      return;
    }
    const opt = $('pOptions').children[Q.c];
    if (opt) opt.click();
  }, 60);
}
}
</script>
</body>
</html>
